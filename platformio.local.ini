; Experimental application-only firmware. Not for ESP32-S3 X4 Pro or X4C.
; Run wiki_harden.py and wiki_integrate.py on a clean checkout before building.
[env:wiki_x4_beta]
extends = base, firmware_tuned
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"1.6.0-wiki-beta2\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
; Use the supported IDF setting rather than inheriting git metadata cached in
; a precompiled SDK. Source commit and dependency identities stay in manifest.
custom_sdkconfig =
  ${firmware_tuned.custom_sdkconfig}
  CONFIG_APP_PROJECT_VER_FROM_CONFIG=y
  CONFIG_APP_PROJECT_VER="1.6.0-wiki-beta2"

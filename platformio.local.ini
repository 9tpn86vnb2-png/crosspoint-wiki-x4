; Experimental application-only firmware. Not for ESP32-S3 X4 Pro or X4C.
; Run python scripts/wiki_integrate.py once on a clean checkout before building.
[env:wiki_x4_beta]
extends = base, firmware_tuned
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"1.6.0-wiki-beta1\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1

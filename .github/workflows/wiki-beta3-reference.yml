name: Wiki beta 3 source interfaces
on:
  push:
    branches: [wiki-x4-beta]
    paths: ['.github/workflows/wiki-beta3-reference.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Collect native Unicode tables, not font assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile, hashlib, json
          out=Path('wiki-beta3-tables');out.mkdir()
          hashes={}
          with tarfile.open(out/'tables.tar.gz','w:gz') as tar:
            for p in Path('lib/MiniBidi').glob('*.t'):
              tar.add(p,arcname=str(p));hashes[str(p)]=hashlib.sha256(p.read_bytes()).hexdigest()
          assert hashes
          (out/'hashes.json').write_text(json.dumps(hashes,indent=2))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: wiki-beta3-unicode-tables-NOT-FIRMWARE
          path: wiki-beta3-tables/
          if-no-files-found: error

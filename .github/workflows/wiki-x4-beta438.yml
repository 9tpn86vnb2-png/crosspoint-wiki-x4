name: X4 Wiki 4.3.8 compact reader chrome

on:
  push:
    branches: [wiki-x4-beta438-build]
    paths:
      - '.github/workflows/wiki-x4-beta438.yml'
      - '.github/wiki438.patch.b64'
      - '.github/WIKI438-NOTE.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-x4-beta438-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev

      - name: Reconstruct and verify Wiki 4.3.7
        run: |
          set -euo pipefail
          python scripts/wiki437_reconstruct.py
          cat .github/wiki437.patch.00 .github/wiki437.patch.01 > /tmp/wiki437.b64
          base64 -d /tmp/wiki437.b64 > /tmp/wiki437.patch.gz
          echo '0ce46d6f2982dc4dc8e4f94c8a5c2e362b2892a70a3b4f27c446d9aab8d2313a  /tmp/wiki437.patch.gz' | sha256sum -c -
          gzip -dc /tmp/wiki437.patch.gz > /tmp/wiki437.patch
          echo 'af0add591352f74ce14064450c105245de1b804272e7c25bd815cf025184f16b  /tmp/wiki437.patch' | sha256sum -c -
          git apply --check /tmp/wiki437.patch
          git apply /tmp/wiki437.patch
          git diff --check
          echo '34b9b2a246be1c5b4a13ceb4da186001068eca8fb6cf3df9aa8499e9eba7a56f  platformio.local.ini' | sha256sum -c -
          echo 'ccbd10df5d409c139872c6813730cd267912903ee434738abe191e7374ed88be  src/activities/wiki/WikiActivity.cpp' | sha256sum -c -
          echo 'ed536d1920e10b614c9735a9627ef305485a84e775511475ce05d3d1398f9103  src/activities/wiki/WikiActivity.h' | sha256sum -c -

      - name: Apply and test Wiki 4.3.8 compact chrome patch
        run: |
          set -euo pipefail
          base64 -d .github/wiki438.patch.b64 > /tmp/wiki438.patch.gz
          echo '8699d4a22142ef57f43498f7a8c5010cf0c54a5aa79e43007ca3fe4fa462159d  /tmp/wiki438.patch.gz' | sha256sum -c -
          gzip -dc /tmp/wiki438.patch.gz > /tmp/wiki438.patch
          echo '59c8d2a6638260820af432b545abe6a75b259e3d4ae22b3e7db4225533cfb81d  /tmp/wiki438.patch' | sha256sum -c -
          git apply --check /tmp/wiki438.patch
          git apply /tmp/wiki438.patch
          git diff --check
          echo 'bc7b23d817c8434b18216fbdab41b55ba44f250a8a6bc1c7289a586c3732b128  platformio.local.ini' | sha256sum -c -
          echo '97872023f40b4385d7997a25694bb4b149d4ea8d799e0f374bc4120918bdf349  src/activities/wiki/WikiActivity.cpp' | sha256sum -c -
          echo 'ed536d1920e10b614c9735a9627ef305485a84e775511475ce05d3d1398f9103  src/activities/wiki/WikiActivity.h' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          cpp=Path('src/activities/wiki/WikiActivity.cpp').read_text()
          ini=Path('platformio.local.ini').read_text()
          checks={
            'version 4.3.8':'1.6.0-wiki-4.3.8' in ini,
            'centered library':'renderer.drawCenteredText(SMALL_FONT_ID,m.topPadding+1,lib.c_str());' in cpp,
            'compact chrome':'const int chromeHeight=std::max(m.batteryBarHeight,smallHeight+4);' in cpp,
            'content begins after compact chrome':'int y=m.topPadding+chromeHeight+4;' in cpp,
            'old article badge removed':'badgeX' not in cpp and 'badgeY' not in cpp and 'badgeW' not in cpp,
            'large page-one title retained':'constexpr int titleNum=3, titleDen=2;' in cpp and 'if (page_==0)' in cpp,
            'page toggle retained':'Page numbers: Shown' in cpp and 'Page numbers: Hidden' in cpp,
            'lower link underline retained':'getTextHeight(runFont)+1' in cpp,
            'tables retained':'renderTableBlock' in cpp,
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed: raise SystemExit('4.3.8 source contracts failed: '+', '.join(failed))
          print(f'{len(checks)} Wiki 4.3.8 source-contract checks passed.')
          PY

      - name: Restore compiler cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.platformio
            .cache
          key: wiki-pio-v6-${{ runner.os }}-${{ hashFiles('platformio.ini','platformio.local.ini') }}
          restore-keys: wiki-pio-v6-${{ runner.os }}-

      - name: Install firmware build dependencies
        run: |
          python -m pip install https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          python -m pip install -r requirements.txt
          python -m pip install 'littlefs-python>=0.16.0' 'fatfs-ng>=0.1.14' 'pyyaml>=6.0.2' 'rich-click>=1.8.6' 'zopfli>=0.2.2' 'intelhex>=2.3.0' 'rich>=14.0.0' 'urllib3<2' 'cryptography>=45.0.3' 'certifi>=2025.8.3' 'ecdsa>=0.19.1' 'bitstring>=4.3.1' 'reedsolo>=1.5.3,<1.8' 'esp-idf-size>=2.0.0' 'esp-coredump>=1.14.0' 'esptool>=5,<6'

      - name: Refresh ESP32-C3 SDK metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          (Path.home()/'.platformio/packages/framework-arduinoespressif32-libs/esp32c3/sdkconfig.crosspoint').unlink(missing_ok=True)
          PY

      - name: Build original X4 application
        run: |
          set -euo pipefail
          pio run -e wiki_x4_beta 2>&1 | tee wiki-build.log

      - name: Validate and package
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python - <<'PY' 2>&1 | tee wiki-package.log
          import hashlib, json, wiki_package as base
          base.NAME='crosspoint-1.6.0-wiki-4.3.8-x4-UNTESTED.bin'
          base.UI_VERSION='1.6.0-wiki-4.3.8'
          base.main()
          p=base.OUT/'build-manifest.json'
          m=json.loads(p.read_text())
          m.update(features=['Wiki 4.3.7 feature set','Centered top XML/CDB library label','Compact battery-height reader chrome','Removed redundant compact article-name badge','More vertical article text space'],hardware_tested=False)
          p.write_text(json.dumps(m,indent=2)+'\n')
          files=sorted(x for x in base.OUT.iterdir() if x.is_file() and x.name!='SHA256SUMS.txt')
          (base.OUT/'SHA256SUMS.txt').write_text(''.join(f"{hashlib.sha256(x.read_bytes()).hexdigest()}  {x.name}\n" for x in files))
          PY

      - uses: actions/upload-artifact@v6
        with:
          name: crosspoint-1.6.0-wiki-4.3.8-x4-UNTESTED
          path: wiki-dist/
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wiki-beta438-build-log
          path: |
            wiki-build.log
            wiki-package.log
          if-no-files-found: ignore

name: X4 Wiki 4.7.4 static display and direct navigation
on:
  push:
    branches: [wiki-x4-4.7.4-experimental]
    paths: ['.github/workflows/wiki474.yml', '.github/wiki474.payload.*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WIKI473_BASE: /tmp/wiki474-base
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: wiki474-c3-${{ github.run_id }}
          restore-keys: |
            wiki474-c3-
            wiki473-c3-
            wiki472-c3-
      - name: Restore exact successful 4.7.3 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 35145779383 -R "$GITHUB_REPOSITORY" -n CrossPoint-Wiki-4.7.3-X4-experimental -D "$RUNNER_TEMP/base473"
          echo "3ac45ccdd758627dc4a6b6e67e6a7fb552e75f45902b8cb49c147fcccc7c5157  $RUNNER_TEMP/base473/4.7.3-source-without-font-assets.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/base473/4.7.3-source-without-font-assets.tar.gz"
          mkdir -p "$WIKI473_BASE"
          cp -a src lib scripts .github platformio.ini platformio.local.ini "$WIKI473_BASE/"
      - name: Apply fingerprint-checked source delta and generate strings
        run: |
          set -euo pipefail
          python - <<'PYLOAD'
          from pathlib import Path
          import base64,hashlib,json,lzma,difflib
          chunks=sorted(Path('.github').glob('wiki474.payload.*'));assert chunks
          blob=base64.b64decode(''.join(p.read_text().strip() for p in chunks),validate=True)
          assert hashlib.sha256(blob).hexdigest()=='24edda4791fc503f4d21175c04a519432a9e0a26f3c876ec55d4656b020df667'
          data=json.loads(lzma.decompress(blob));updated={};patch=[]
          for name,item in data.items():
              p=Path(name);assert not p.is_absolute() and '..' not in p.parts
              prior=p.read_bytes() if p.exists() else b''
              assert (hashlib.sha256(prior).hexdigest()==item['base']) if item['base'] else not p.exists(),name
              lines=prior.decode().splitlines(True);end=len(lines)
              for start,stop,replacement in reversed(item['edits']):
                  assert 0<=start<=stop<=end
                  lines[start:stop]=replacement.splitlines(True);end=start
              final=''.join(lines).encode();assert hashlib.sha256(final).hexdigest()==item['after'],name
              updated[p]=final
              if name.startswith(('src/','lib/')) or name=='platformio.local.ini':patch.extend(difflib.unified_diff(prior.decode().splitlines(True),final.decode().splitlines(True),fromfile='a/'+name,tofile='b/'+name))
          for p,final in updated.items():p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(final)
          Path('4.7.3-to-4.7.4.patch').write_text(''.join(patch))
          print('Verified and applied',len(updated),'source/support files')
          PYLOAD
          python scripts/gen_i18n.py --strip-unused
          python .github/wiki474_release.py prepare
      - name: Test legacy checkpoints, direct-link faults, ten-item scrolling and markup
        run: |
          set -euo pipefail
          ulimit -c 0
          python -u .github/wiki474_release.py upgrade 2>&1 | tee wiki474-upgrade.log
          python -u .github/wiki474_release.py test 2>&1 | tee wiki474-preflight.log
      - name: Compile original X4 application using PlatformIO CLI
        id: compile
        run: bash .github/wiki441_toolchain.sh
      - name: Verify final source, compiled flags, image and post-build tests
        run: |
          set -euo pipefail
          pio run -e wiki_x4_beta -t compiledb > wiki474-compiledb.log 2>&1
          python .github/wiki474_release.py flags
          python -u .github/wiki474_release.py test 2>&1 | tee wiki474-postbuild.log
          python -u .github/wiki463_host/run.py --json .pio/libdeps/wiki_x4_beta/ArduinoJson/src 2>&1 | tee wiki474-algorithms.log
          python .github/wiki474_release.py package
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: CrossPoint-Wiki-4.7.4-X4-experimental
          path: wiki474-dist/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wiki474-diagnostics
          path: |
            wiki-build.log
            wiki474-*.log
            wiki474-*.json
            wiki471-*.json
            wiki465-tests.json
            wiki470-tests.json
          retention-days: 14
      - uses: actions/cache/save@v4
        if: always() && steps.compile.outcome != 'skipped'
        with:
          path: |
            ~/.platformio
            .pio
          key: wiki474-c3-${{ github.run_id }}

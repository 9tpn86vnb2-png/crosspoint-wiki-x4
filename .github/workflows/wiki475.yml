name: X4 Wiki 4.7.5 buffered SPI experiment
on:
  push:
    branches: [wiki-x4-4.7.5-buffered-spi]
    paths: ['.github/workflows/wiki475.yml', '.github/wiki475*', '.github/buffered_spi_release_fix.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WIKI475_BASE: /tmp/wiki475-base
      WIKI475_BASE_ARTIFACT: /tmp/wiki475-base-artifact
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: wiki475-c3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wiki475-c3-
            wiki474-c3-
      - name: Fetch exact pinned registry wrapper through alternate official endpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          python - <<'PY'
          import hashlib,io,json,os,subprocess,zipfile
          from pathlib import Path
          from platformio.package.manager.tool import ToolPackageManager
          url='https://github.com/pioarduino/registry/releases/download/0.0.1/riscv32-esp-elf-14.2.0_20251107.zip'
          expected='33abc2866247754ccca35f75329a12d99cbb55baaec533d99ee5d373473daeaa'
          pm=ToolPackageManager();cache=Path(pm.compute_download_path(url,''));cache.parent.mkdir(parents=True,exist_ok=True)
          data=cache.read_bytes() if cache.is_file() else b''
          route='verified existing download cache'
          if hashlib.sha256(data).hexdigest()!=expected:
              temporary=Path(os.environ['RUNNER_TEMP'])/'wiki475-pinned-compiler-wrapper.zip'
              routes=[('official release asset API',['gh','api','-H','Accept: application/octet-stream','repos/pioarduino/registry/releases/assets/318517187']),('official browser endpoint cache bypass',['curl','-fL','--retry','1','--connect-timeout','15','--max-time','90',url+'?download=1'])]
              for route,cmd in routes:
                  try:
                      with temporary.open('wb') as f:r=subprocess.run(cmd,stdout=f,stderr=subprocess.PIPE,timeout=120)
                  except subprocess.TimeoutExpired:continue
                  data=temporary.read_bytes()
                  if r.returncode==0 and hashlib.sha256(data).hexdigest()==expected:break
              else:raise RuntimeError('Exact official registry wrapper unavailable through bounded alternate routes')
              cache.write_bytes(data)
          assert hashlib.sha256(data).hexdigest()==expected
          pm.set_download_utime(str(cache))
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.testzip() is None
              members=z.namelist()
          report={'source_url':url,'release_asset_id':318517187,'sha256':expected,'bytes':len(data),'route':route,'members':members,'compiler_version_changed':False,'firmware_source_changed':False}
          Path('wiki475-toolchain-download.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Restore exact compiled 4.7.4 and preserve comparison source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 35155882489 -R "$GITHUB_REPOSITORY" -n CrossPoint-Wiki-4.7.4-X4-experimental -D "$WIKI475_BASE_ARTIFACT"
          echo "568c0e57af3b4861858fede6a7ebe1050db8d873885e7ac8cd62fb87ddef94f6  $WIKI475_BASE_ARTIFACT/4.7.4-source-without-font-assets.tar.gz" | sha256sum -c -
          tar -xzf "$WIKI475_BASE_ARTIFACT/4.7.4-source-without-font-assets.tar.gz"
          mkdir -p "$WIKI475_BASE"
          cp -a src lib scripts .github freeink-sdk platformio.ini platformio.local.ini "$WIKI475_BASE/"
      - name: Apply only buffered-SPI flag and version, retain source integrity gates
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma
          blob=base64.b64decode(Path('.github/wiki475.payload.b64').read_text().strip(),validate=True)
          assert hashlib.sha256(blob).hexdigest()=='c5619fa61060145335f0974638a554fc02149b77eab73db124e53ffa2c0e6000'
          data=json.loads(lzma.decompress(blob))
          for n,text in data.items():
              p=Path(n);assert not p.is_absolute() and '..' not in p.parts and not p.exists(),n
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          PY
          python .github/buffered_spi_release_fix.py
          python scripts/build_html.py
          python .github/wiki475_release.py apply
          python scripts/gen_i18n.py --strip-unused
          python .github/wiki475_release.py prepare
      - name: Check checkpoint compatibility and unchanged index bytes
        run: |
          set -euo pipefail
          ulimit -c 0
          python -u .github/wiki475_release.py upgrade 2>&1 | tee wiki475-upgrade.log
      - name: Compile original X4 application with PlatformIO CLI
        id: compile
        run: bash .github/wiki441_toolchain.sh
      - name: Test actual installed SdFat array and scalar transfer semantics
        run: |
          set -euo pipefail
          python -u .github/wiki475_spi_tests.py 2>&1 | tee wiki475-spi-tests.log
      - name: Post-build regression suites, compiler evidence and image packaging
        run: |
          set -euo pipefail
          python -m pip install pyelftools
          pio run -e wiki_x4_beta -t compiledb > wiki475-compiledb.log 2>&1
          python -u .github/wiki475_release.py test 2>&1 | tee wiki475-postbuild.log
          python -u .github/wiki463_host/run.py --json .pio/libdeps/wiki_x4_beta/ArduinoJson/src 2>&1 | tee wiki475-algorithms.log
          python -u .github/wiki475_release.py package 2>&1 | tee wiki475-packaging.log
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: CrossPoint-Wiki-4.7.5-X4-experimental
          path: wiki475-dist/
          retention-days: 30
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wiki475-diagnostics
          path: |
            wiki-build.log
            wiki475-*.log
            wiki475-*.json
            wiki475-*.txt
            wiki474-*.json
          retention-days: 14
          overwrite: true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.platformio
            .pio
          key: wiki475-c3-${{ github.run_id }}-${{ github.run_attempt }}

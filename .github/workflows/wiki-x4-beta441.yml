name: X4 Wiki 4.6.1 leaf icon hotfix
on:
  push:
    branches: [wiki-x4-beta441-build]
    paths:
      - '.github/workflows/wiki-x4-beta441.yml'
      - '.github/wiki441_build.sh.00'
      - '.github/wiki441_build.sh.01a1'
      - '.github/wiki441_verify.sh'
      - '.github/wiki441_toolchain.sh'
      - '.github/wiki441_contract_tests.py'
      - '.github/wiki441_exception_profile.py'
      - '.github/wiki441_memory_patch.py.*'
      - '.github/wiki441_qol.patch.gz.b64'
      - '.github/wiki442_epub_patch.py'
      - '.github/wiki442_contract_tests.py'
      - '.github/wiki450_apply.py'
      - '.github/wiki450_contract_tests.py'
      - '.github/wiki450_scoped_exceptions.py'
      - '.github/wiki451_apply.py'
      - '.github/wiki451_contract_tests.py'
      - '.github/wiki451_package.sh'
      - '.github/wiki451/**'
      - '.github/wiki452_apply.py'
      - '.github/wiki452_contract_tests.py'
      - '.github/wiki452_package.sh'
      - '.github/wiki453_apply.py'
      - '.github/wiki453_apply.b64.*'
      - '.github/wiki453_contract_tests.py'
      - '.github/wiki453_contract_tests.b64.*'
      - '.github/wiki453_package.sh'
      - '.github/wiki454_apply.py'
      - '.github/wiki454_contract_tests.py'
      - '.github/wiki454_package.sh'
      - '.github/wiki460_apply.py'
      - '.github/wiki460_contract_tests.py'
      - '.github/wiki460_package.sh'
      - '.github/wiki461_apply.py'
      - '.github/wiki461_contract_tests.py'
      - '.github/wiki461_package.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Reconstruct 4.4.0
        run: bash .github/wiki441_build.sh.00
      - name: Apply 4.4.1 crash + QoL fixes
        run: bash .github/wiki441_build.sh.01a1
      - name: Verify 4.4.1 contracts
        run: bash .github/wiki441_verify.sh
      - name: Apply 4.4.2 EPUB helper cleanup
        run: python .github/wiki442_epub_patch.py
      - name: Verify 4.4.2 EPUB contracts
        run: python .github/wiki442_contract_tests.py
      - name: Apply 4.5.0 table renderer and scoped exceptions
        run: python .github/wiki450_apply.py
      - name: Verify 4.5.0 contracts
        run: python .github/wiki450_contract_tests.py
      - name: Apply 4.5.1 typography, Finished Books, and efficiency changes
        run: python .github/wiki451_apply.py
      - name: Verify 4.5.1 contracts
        run: python .github/wiki451_contract_tests.py
      - name: Apply 4.5.2 Finished Books completion and UI fixes
        run: python .github/wiki452_apply.py
      - name: Verify 4.5.2 contracts
        run: python .github/wiki452_contract_tests.py
      - name: Apply 4.5.3 tables, Finished action, and Power Save
        run: python .github/wiki453_apply.py
      - name: Verify 4.5.3 contracts
        run: python .github/wiki453_contract_tests.py
      - name: Apply 4.5.4 safe Power Save hotfix
        run: python .github/wiki454_apply.py
      - name: Verify 4.5.4 contracts
        run: python .github/wiki454_contract_tests.py
      - name: Apply 4.6.0 hyper optimization
        run: python .github/wiki460_apply.py
      - name: Verify 4.6.0 contracts
        run: python .github/wiki460_contract_tests.py
      - name: Apply 4.6.1 battery-sized Power Saving leaf
        run: python .github/wiki461_apply.py
      - name: Verify 4.6.1 leaf contracts
        run: python .github/wiki461_contract_tests.py
      - name: Install toolchain and build original X4
        run: bash .github/wiki441_toolchain.sh
      - name: Compare flash size
        run: |
          python - <<'PY'
          from pathlib import Path
          new = Path('.pio/build/wiki_x4_beta/firmware.bin').stat().st_size
          v460 = 5539696
          v442 = 6025200
          slot = 6553600
          print(f'4.4.2 firmware.bin: {v442} bytes')
          print(f'4.6.0 firmware.bin: {v460} bytes')
          print(f'4.6.1 firmware.bin: {new} bytes')
          print(f'Change vs 4.6.0: {new-v460:+d} bytes')
          print(f'Saved vs 4.4.2: {v442-new} bytes')
          print(f'Application slot headroom: {slot-new} bytes')
          if new > v460 + 8192:
              raise SystemExit('4.6.1 leaf-only hotfix grew unexpectedly')
          if new >= v442:
              raise SystemExit('4.6.1 lost the 4.5.x flash optimization')
          if new >= slot:
              raise SystemExit('4.6.1 does not fit the original X4 app slot')
          PY
      - name: Package 4.6.1
        run: bash .github/wiki461_package.sh
      - uses: actions/upload-artifact@v6
        with:
          name: crosspoint-1.6.0-wiki-4.6.1-x4-UNTESTED
          path: wiki-dist/

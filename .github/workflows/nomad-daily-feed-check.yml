name: Nomad Daily feed availability
on:
  push:
    branches: [nomad-daily-prototype]
    paths: [.github/workflows/nomad-daily-feed-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Request public feed URLs once each
        shell: python
        run: |
          import urllib.request, urllib.error, json, pathlib, datetime, concurrent.futures
          urls = [
            ('openrss-top', 'https://openrss.org/reddit.com/r/singularity/top/?t=day'),
            ('openrss-new', 'https://openrss.org/reddit.com/r/singularity/new/'),
            ('reddit-native', 'https://www.reddit.com/r/singularity/top/.rss?t=day&limit=20'),
            ('bbc-tech', 'https://feeds.bbci.co.uk/news/technology/rss.xml'),
          ]
          folder = pathlib.Path('feed-check'); folder.mkdir()
          def check(pair):
            name, url = pair
            result = {'name': name, 'url': url, 'at': datetime.datetime.now(datetime.timezone.utc).isoformat()}
            req = urllib.request.Request(url, headers={'User-Agent': 'NomadDaily/0.1 (personal RSS reader; Android)', 'Accept': 'application/rss+xml, application/atom+xml, application/xml, text/xml;q=0.9'})
            try:
              with urllib.request.urlopen(req, timeout=30) as response:
                data = response.read(2097152)
                result.update(status=response.status, content_type=response.headers.get('Content-Type'), bytes=len(data))
                (folder / (name + '.response')).write_bytes(data)
            except urllib.error.HTTPError as error:
              result.update(status=error.code, error=str(error))
              (folder / (name + '.error.txt')).write_bytes(error.read(20000))
            except Exception as error:
              result.update(error=str(error))
            print(json.dumps(result), flush=True)
            return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
            results = list(executor.map(check, urls))
          (folder/'results.json').write_text(json.dumps(results, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: nomad-feed-check
          path: feed-check/
          retention-days: 1

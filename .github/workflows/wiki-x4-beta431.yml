name: X4 Wiki 4.3.4 spacing and reference fixes

on:
  push:
    branches: [wiki-x4-beta434-build]
    paths: ['.github/workflows/wiki-x4-beta431.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-x4-beta434-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
      - name: Reconstruct reviewed Wiki 4.3.1
        run: |
          set -euo pipefail
          python scripts/wiki_beta40_ci_integrate.py 2>&1 | tee wiki-beta40-integration.log
          python scripts/wiki_beta41_integrate.py 2>&1 | tee wiki-beta41-integration.log
          python scripts/wiki_beta41_tests.py 2>&1 | tee wiki-beta41-tests.log
          python scripts/wiki_beta42_integrate.py 2>&1 | tee wiki-beta42-integration.log
          python scripts/wiki_beta42_tests.py 2>&1 | tee wiki-beta42-tests.log
          python scripts/wiki_beta43_integrate.py 2>&1 | tee wiki-beta43-integration.log
          python scripts/wiki_beta43_tests.py 2>&1 | tee wiki-beta43-tests.log
          python scripts/wiki_beta431_integrate.py 2>&1 | tee wiki-beta431-integration.log
          python scripts/wiki_beta431_tests.py 2>&1 | tee wiki-beta431-tests.log
      - name: Apply verified Wiki 4.3.3 combined patch
        run: |
          set -euo pipefail
          cat .clangd .clang-format GOVERNANCE.md README.md .gitignore > /tmp/wiki433.b64
          base64 -d /tmp/wiki433.b64 > /tmp/wiki433.patch.gz
          echo '859809bf044723681e042e7bc100b0f5cffaf3877bdaaae859ac8a283802c689  /tmp/wiki433.patch.gz' | sha256sum -c -
          gzip -dc /tmp/wiki433.patch.gz > /tmp/wiki433.patch
          echo '9351d830c148dd8e907a908041816f62a65cee9f5e5eec334e2999122883df82  /tmp/wiki433.patch' | sha256sum -c -
          git apply --check /tmp/wiki433.patch
          git apply /tmp/wiki433.patch
          python - <<'PYFIX'
          from pathlib import Path
          p=Path('src/activities/wiki/WikiArchive.cpp')
          s=p.read_text()
          old='std::min(source.size(),gt+1+XML_MAX_REFERENCE_BYTES*4u)'
          new='std::min<size_t>(source.size(),gt+1+size_t(XML_MAX_REFERENCE_BYTES)*4u)'
          if s.count(old)!=1:
              raise SystemExit(f'Wiki 4.3.3 ref bound fix expected one match, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PYFIX
          git diff --check
          cat > /tmp/wiki433.expected <<'EOF'
          599342ca84b3d215671b3ac7c32fa2a701b271620f4dd1019fbf7f6b2386fe1c  platformio.local.ini
          27377f3e62526f2ce483d528d67e081a6528815a485471cfe2d9a9c3be6fa2f9  src/activities/wiki/WikiActivity.cpp
          84721b20855dffc32037cf64bccdb9f4c86b934dad80a659fae714f88d91642d  src/activities/wiki/WikiArchive.cpp
          dd3abee64269b86ba7ce98afad660ab01a2769054aa41fdabbb25ffd6272a355  src/activities/wiki/WikiArchive.h
          5f78bd1d6ab08223af146ca3c7ccb4792f29f0d29d98e5c53928d3979fbd5254  src/activities/wiki/WikiHeading.cpp
          9c4021c03ab7177134a9d8fa2b32c2b008d623288f87c63ef329c89be9fe0b0a  src/activities/wiki/WikiHeading.h
          2946d49dcfa8f15bc4df98dfe4e916c762d51622cd269cedf9c018abd0f624e5  src/activities/wiki/WikiText.cpp
          1fa0f92befc5686308a3c424e6fa84109534ece7057dee55ba725be1cf398d17  src/activities/wiki/WikiText.h
          EOF
          sed -i 's/^          //' /tmp/wiki433.expected
          sha256sum -c /tmp/wiki433.expected | tee wiki-beta433-source.log
      - name: Test Wiki 4.3.3 semantic contracts
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee wiki-beta433-tests.log
          from pathlib import Path
          A=Path('src/activities/wiki/WikiArchive.cpp').read_text(); H=Path('src/activities/wiki/WikiArchive.h').read_text()
          T=Path('src/activities/wiki/WikiText.cpp').read_text(); TH=Path('src/activities/wiki/WikiText.h').read_text()
          U=Path('src/activities/wiki/WikiActivity.cpp').read_text(); HH=Path('src/activities/wiki/WikiHeading.h').read_text()
          P=Path('platformio.local.ini').read_text()
          checks={
            'version':P.count('1.6.0-wiki-4.3.3')==2,
            'links':'struct LinkInfo' in H and 'ExternalLink' in TH,
            'categories':'std::vector<std::string> categories' in H and 'categories.push_back' in A,
            'refs':'struct ReferenceInfo' in H and 'XML_MAX_REFERENCES = 48' in H and '== References ==' in A,
            'captions':'Caption: ' in A and 'fileLayoutOption' in A,
            'tables':'normalizeTableSource' in A and ' — ' in A,
            'small-html':'SMALL_MARKER' in TH and 'smallOpen' in A,
            'punctuation':'inlinePunctuation' in U and '!punctuation(input[clusterEnd])' in T,
            'lists':all(x in TH for x in ['ListBullet','ListNumber','DefinitionTerm','DefinitionBody']),
            'rich-headings':'measureRich' in HH and 'drawRich' in HH,
            'budgets':all(x in H for x in ['XML_MAX_LINKS = 64','XML_MAX_CATEGORIES = 32','XML_MAX_REFERENCES = 48','XML_MAX_TEMPLATE_SCAN = 16384']),
            'entities':all(x in A for x in ['"nbsp"','"mdash"','"hellip"','"ldquo"','"rdquo"']),
            'banner':'renderer.drawText(SMALL_FONT_ID,right-libW,textY,lib.c_str())' in U,
          }
          bad=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('PASS' if v else 'FAIL')+': '+k)
          if bad: raise SystemExit('failed: '+', '.join(bad))
          PY
          cat >/tmp/wiki433-host.cpp <<'CPP'
          #include <cstdlib>
          #include <iostream>
          #include <string>
          #include "WikiText.h"
          static void expect(const std::string& s,const std::string& e){char o[512];WikiText::stripInlineStyles(s.c_str(),o,sizeof(o));if(std::string(o)!=e){std::cerr<<o<<" != "<<e<<"\n";std::exit(1);}}
          int main(){expect("the'''MOON'''is","the MOON is");expect("The '''Sun'''.","The Sun.");std::string l="see";l.push_back(char(WikiText::LINK_MARKER));l+="Moon";l.push_back(char(WikiText::LINK_MARKER));l+=", now";expect(l,"see Moon, now");WikiText::Document d;d.build("* Bullet\n# Number\n;Term\n:Definition\n=Heading=\n",true);bool b=0,n=0,t=0,x=0,h=0;for(size_t i=0;i<d.count();++i){auto &q=d.block(i);b|=q.kind==WikiText::Kind::ListBullet;n|=q.kind==WikiText::Kind::ListNumber&&q.ordinal==1;t|=q.kind==WikiText::Kind::DefinitionTerm;x|=q.kind==WikiText::Kind::DefinitionBody;h|=q.kind==WikiText::Kind::Heading&&q.level==1;}return !(b&&n&&t&&x&&h);}
          CPP
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -Isrc/activities/wiki /tmp/wiki433-host.cpp src/activities/wiki/WikiText.cpp -o /tmp/wiki433-host
          ASAN_OPTIONS=detect_leaks=1 /tmp/wiki433-host 2>&1 | tee wiki-beta433-host.log

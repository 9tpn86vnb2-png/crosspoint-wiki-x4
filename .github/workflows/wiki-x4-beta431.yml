name: X4 Wiki 4.3.3 semantic reader

on:
  push:
    branches: [wiki-x4-beta433-build]
    paths:
      - '.github/workflows/wiki-x4-beta431.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-x4-beta433-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev

      - name: Reconstruct reviewed Wiki 4.3.1 source
        run: |
          set -euo pipefail
          python scripts/wiki_beta40_ci_integrate.py 2>&1 | tee wiki-beta40-integration.log
          python scripts/wiki_beta41_integrate.py 2>&1 | tee wiki-beta41-integration.log
          python scripts/wiki_beta41_tests.py 2>&1 | tee wiki-beta41-tests.log
          python scripts/wiki_beta42_integrate.py 2>&1 | tee wiki-beta42-integration.log
          python scripts/wiki_beta42_tests.py 2>&1 | tee wiki-beta42-tests.log
          python scripts/wiki_beta43_integrate.py 2>&1 | tee wiki-beta43-integration.log
          python scripts/wiki_beta43_tests.py 2>&1 | tee wiki-beta43-tests.log
          python scripts/wiki_beta431_integrate.py 2>&1 | tee wiki-beta431-integration.log
          python scripts/wiki_beta431_tests.py 2>&1 | tee wiki-beta431-tests.log

      - name: Apply Wiki 4.3.2 banner and formatted-spacing changes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          p = Path('src/activities/wiki/WikiText.cpp')
          s = p.read_text()
          s = replace_once(s, '''size_t stripInlineStyles(const char* input, char* output, size_t capacity) {
            if (!capacity) return 0;
            output[0] = 0;
            if (!input) return 0;
            const size_t end = std::strlen(input);
            size_t used = 0;
            for (size_t p = 0; p < end;) {
              size_t markerEnd = p; uint8_t toggle = Regular;
              if (inlineStyleMarker(input, p, end, markerEnd, toggle)) { p = markerEnd; continue; }
              const unsigned char c = static_cast<unsigned char>(input[p]);
              size_t n = c < 0x80 ? 1 : (c >= 0xc2 && c <= 0xdf ? 2 : (c >= 0xe0 && c <= 0xef ? 3 : (c >= 0xf0 && c <= 0xf4 ? 4 : 1)));
              n = std::min(n, end - p);
              if (used + n >= capacity) break;
              for (size_t k = 0; k < n; ++k) output[used++] = input[p + k];
              p += n;
            }
            output[used] = 0;
            return used;
          }
          ''', '''size_t stripInlineStyles(const char* input, char* output, size_t capacity) {
            if (!capacity) return 0;
            output[0] = 0;
            if (!input) return 0;
            const size_t end = std::strlen(input);
            size_t used = 0;
            uint8_t style = Regular;
            for (size_t p = 0; p < end;) {
              size_t markerEnd = p; uint8_t toggle = Regular;
              if (inlineStyleMarker(input, p, end, markerEnd, toggle)) {
                uint8_t nextStyle = style ^ toggle;
                size_t clusterEnd = markerEnd;
                while (clusterEnd < end) {
                  size_t nextEnd = clusterEnd; uint8_t nextToggle = Regular;
                  if (!inlineStyleMarker(input, clusterEnd, end, nextEnd, nextToggle)) break;
                  nextStyle ^= nextToggle;
                  clusterEnd = nextEnd;
                }
                const bool beforeFormatted = (style & (Bold | Italic | Link)) != 0;
                const bool afterFormatted = (nextStyle & (Bold | Italic | Link)) != 0;
                const bool leftTight = used > 0 && !space(output[used - 1]);
                const bool rightTight = clusterEnd < end && !space(input[clusterEnd]);
                if (beforeFormatted != afterFormatted && leftTight && rightTight && used + 1 < capacity) output[used++] = ' ';
                style = nextStyle;
                p = clusterEnd;
                continue;
              }
              const unsigned char c = static_cast<unsigned char>(input[p]);
              size_t n = c < 0x80 ? 1 : (c >= 0xc2 && c <= 0xdf ? 2 : (c >= 0xe0 && c <= 0xef ? 3 : (c >= 0xf0 && c <= 0xf4 ? 4 : 1)));
              n = std::min(n, end - p);
              if (used + n >= capacity) break;
              for (size_t k = 0; k < n; ++k) output[used++] = input[p + k];
              p += n;
            }
            output[used] = 0;
            return used;
          }
          ''', 'WikiText stripInlineStyles')
          p.write_text(s)

          p = Path('src/activities/wiki/WikiActivity.cpp')
          s = p.read_text()
          s = replace_once(s, '''EpdFontFamily::Style fontStyle(uint8_t style) {
            return static_cast<EpdFontFamily::Style>(style & (WikiText::Bold | WikiText::Italic));
          }
          ''', '''EpdFontFamily::Style fontStyle(uint8_t style) {
            return static_cast<EpdFontFamily::Style>(style & (WikiText::Bold | WikiText::Italic));
          }

          bool inlineSpace(char c) { return c == ' ' || c == 9 || c == 10 || c == 11 || c == 13; }
          bool formattedInline(uint8_t style) { return (style & (WikiText::Bold | WikiText::Italic | WikiText::Link)) != 0; }

          size_t inlineStyleCluster(const char* text, size_t pos, size_t length, uint8_t currentStyle, uint8_t& nextStyle) {
            size_t markerEnd = pos; uint8_t toggle = WikiText::Regular;
            if (!WikiText::inlineStyleMarker(text,pos,length,markerEnd,toggle)) { nextStyle=currentStyle; return pos; }
            nextStyle=currentStyle ^ toggle;
            size_t clusterEnd=markerEnd;
            while (clusterEnd<length) {
              size_t nextEnd=clusterEnd; uint8_t nextToggle=WikiText::Regular;
              if (!WikiText::inlineStyleMarker(text,clusterEnd,length,nextEnd,nextToggle)) break;
              nextStyle^=nextToggle;
              clusterEnd=nextEnd;
            }
            return clusterEnd;
          }

          bool needsFormattedBoundarySpace(const char* text, size_t markerStart, size_t markerEnd, size_t length,
                                           uint8_t beforeStyle, uint8_t afterStyle) {
            return formattedInline(beforeStyle) != formattedInline(afterStyle) &&
                markerStart > 0 && markerEnd < length && !inlineSpace(text[markerStart-1]) && !inlineSpace(text[markerEnd]);
          }
          ''', 'WikiActivity helpers')

          old = '''    size_t markerEnd=pos; uint8_t toggle=WikiText::Regular;
              if (WikiText::inlineStyleMarker(line,pos,length,markerEnd,toggle)) {
                flush(pos); style^=toggle; pos=begin=markerEnd; continue;
              }
          '''
          measure = '''    size_t markerEnd=pos; uint8_t toggle=WikiText::Regular;
              if (WikiText::inlineStyleMarker(line,pos,length,markerEnd,toggle)) {
                flush(pos);
                uint8_t nextStyle=style;
                const size_t clusterEnd=inlineStyleCluster(line,pos,length,style,nextStyle);
                if (needsFormattedBoundarySpace(line,pos,clusterEnd,length,style,nextStyle))
                  width+=std::max(1,renderer.getTextWidth(font," "));
                style=nextStyle; pos=begin=clusterEnd; continue;
              }
          '''
          draw = '''    size_t markerEnd=pos; uint8_t toggle=WikiText::Regular;
              if (WikiText::inlineStyleMarker(line,pos,length,markerEnd,toggle)) {
                flush(pos);
                uint8_t nextStyle=style;
                const size_t clusterEnd=inlineStyleCluster(line,pos,length,style,nextStyle);
                if (needsFormattedBoundarySpace(line,pos,clusterEnd,length,style,nextStyle))
                  x+=std::max(1,renderer.getTextWidth(font," "));
                style=nextStyle; pos=begin=clusterEnd; continue;
              }
          '''
          if s.count(old) != 2:
              raise SystemExit(f'WikiActivity rich marker block: expected 2 matches, found {s.count(old)}')
          s = s.replace(old, measure, 1).replace(old, draw, 1)
          s = replace_once(s, '''    const int available=std::max(40,right-left);
              const int libraryCap=std::max(44,std::min(available/3,140));
              const auto lib=renderer.truncatedText(SMALL_FONT_ID,libraryName_.c_str(),libraryCap);
              const std::string prefix=lib+": ";
              renderer.drawText(SMALL_FONT_ID,left,textY,prefix.c_str());
              const int prefixW=renderer.getTextWidth(SMALL_FONT_ID,prefix.c_str());
              const auto article=renderer.truncatedText(UI_10_FONT_ID,title_.c_str(),std::max(20,available-prefixW),EpdFontFamily::BOLD);
              renderer.drawText(UI_10_FONT_ID,left+prefixW,textY,article.c_str(),true,EpdFontFamily::BOLD);
          ''', '''    const int available=std::max(40,right-left);
              const int bannerGap=12;
              const int libraryCap=std::max(44,std::min(available/3,160));
              const auto lib=renderer.truncatedText(SMALL_FONT_ID,libraryName_.c_str(),libraryCap);
              const int libW=renderer.getTextWidth(SMALL_FONT_ID,lib.c_str());
              const auto article=renderer.truncatedText(UI_10_FONT_ID,title_.c_str(),std::max(20,available-libW-bannerGap),EpdFontFamily::BOLD);
              renderer.drawText(UI_10_FONT_ID,left,textY,article.c_str(),true,EpdFontFamily::BOLD);
              renderer.drawText(SMALL_FONT_ID,right-libW,textY,lib.c_str());
          ''', 'WikiActivity banner')
          p.write_text(s)

          p = Path('platformio.local.ini')
          s = p.read_text()
          if s.count('1.6.0-wiki-4.3.1') != 2:
              raise SystemExit('platformio.local.ini version mismatch')
          p.write_text(s.replace('1.6.0-wiki-4.3.1','1.6.0-wiki-4.3.2'))
          PY
          git diff --check

      - name: Test Wiki 4.3.2 source contracts and text spacing
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          wiki=Path('src/activities/wiki/WikiActivity.cpp').read_text()
          wt=Path('src/activities/wiki/WikiText.cpp').read_text()
          pio=Path('platformio.local.ini').read_text()
          checks={
            '4.3.2 version':'1.6.0-wiki-4.3.2' in pio,
            'article title left':'renderer.drawText(UI_10_FONT_ID,left,textY,article.c_str(),true,EpdFontFamily::BOLD)' in wiki,
            'library right':'renderer.drawText(SMALL_FONT_ID,right-libW,textY,lib.c_str())' in wiki,
            'no banner colon':'const std::string prefix=lib+": ";' not in wiki,
            'formatted boundary helper':'needsFormattedBoundarySpace' in wiki,
            'measurement spacing':'width+=std::max(1,renderer.getTextWidth(font," "))' in wiki,
            'drawing spacing':'x+=std::max(1,renderer.getTextWidth(font," "))' in wiki,
            'strip spacing':'beforeFormatted != afterFormatted && leftTight && rightTight' in wt,
          }
          bad=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('PASS' if v else 'FAIL')+': '+k)
          if bad: raise SystemExit('failed: '+', '.join(bad))
          PY
          cat >/tmp/wiki-beta432-text-host.cpp <<'CPP'
          #include <cstdlib>
          #include <iostream>
          #include <string>
          #include "WikiText.h"
          static void expect(const std::string& source,const std::string& expected,const char* label){
            char out[512]; WikiText::stripInlineStyles(source.c_str(),out,sizeof(out));
            if(std::string(out)!=expected){std::cerr<<"FAIL "<<label<<": ["<<out<<"] != ["<<expected<<"]\n"; std::exit(1);} std::cout<<"PASS "<<label<<"\n";
          }
          int main(){
            expect("the'''MOON'''is","the MOON is","bold tight boundaries");
            expect("the ''Moon'' is","the Moon is","existing italic spaces stay single");
            expect("x'''''styled'''''y","x styled y","bold italic tight boundaries");
            std::string link="see"; link.push_back(char(WikiText::LINK_MARKER)); link+="Moon"; link.push_back(char(WikiText::LINK_MARKER)); link+="now";
            expect(link,"see Moon now","link tight boundaries");
            expect("word'''bold''italic''bold'''tail","word bolditalicbold tail","nested formatting no internal padding");
            return 0;
          }
          CPP
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -Isrc/activities/wiki /tmp/wiki-beta432-text-host.cpp src/activities/wiki/WikiText.cpp -o /tmp/wiki-beta432-text-host
          ASAN_OPTIONS=detect_leaks=1 /tmp/wiki-beta432-text-host 2>&1 | tee wiki-beta432-host.log


      - name: Apply Wiki 4.3.3 semantic reader patch
        run: |
          set -euo pipefail
          base64 -d CLAUDE.md >/tmp/wiki-4.3.3.patch.gz
          echo "a11b4d53e6620f3c4fe2528dea6f86515d2ae04b6a9a4242eb7a4d85a934fc55  /tmp/wiki-4.3.3.patch.gz" | sha256sum -c -
          gzip -dc /tmp/wiki-4.3.3.patch.gz >/tmp/wiki-4.3.3.patch
          echo "80d190fdaf5e41a2b46ff432970d66dde07e8c03c4cc02af0c8dff362f19d9b3  /tmp/wiki-4.3.3.patch" | sha256sum -c -
          git apply --check /tmp/wiki-4.3.3.patch
          git apply /tmp/wiki-4.3.3.patch
          git diff --check
          sha256sum platformio.local.ini src/activities/wiki/WikiActivity.cpp src/activities/wiki/WikiArchive.cpp src/activities/wiki/WikiArchive.h src/activities/wiki/WikiHeading.cpp src/activities/wiki/WikiHeading.h src/activities/wiki/WikiText.cpp src/activities/wiki/WikiText.h | tee wiki-beta433-source.log

      - name: Test Wiki 4.3.3 semantic source contracts
        run: |
          set -euo pipefail
          cat >/tmp/wiki-beta433-tests.py <<'PY'
          from pathlib import Path
          ROOT=Path('.')
          files={p:(ROOT/p).read_text() for p in [
           'platformio.local.ini','src/activities/wiki/WikiArchive.h','src/activities/wiki/WikiArchive.cpp',
           'src/activities/wiki/WikiText.h','src/activities/wiki/WikiText.cpp',
           'src/activities/wiki/WikiActivity.cpp','src/activities/wiki/WikiHeading.h','src/activities/wiki/WikiHeading.cpp']}
          checks={
           '4.3.3 version': files['platformio.local.ini'].count('1.6.0-wiki-4.3.3')==2,
           'semantic link metadata': 'struct LinkInfo' in files['src/activities/wiki/WikiArchive.h'] and 'uint32_t begin = 0' in files['src/activities/wiki/WikiArchive.h'],
           'category metadata retained': 'std::vector<std::string> categories' in files['src/activities/wiki/WikiArchive.h'] and 'semantic->categories.push_back(category)' in files['src/activities/wiki/WikiArchive.cpp'],
           'reference metadata and bounded count': 'struct ReferenceInfo' in files['src/activities/wiki/WikiArchive.h'] and 'XML_MAX_REFERENCES = 48' in files['src/activities/wiki/WikiArchive.h'],
           'named reference reuse': 'findRef(name)' in files['src/activities/wiki/WikiArchive.cpp'] and 'selfClosingTag(tag)' in files['src/activities/wiki/WikiArchive.cpp'],
           'generated reference list': '== References ==' in files['src/activities/wiki/WikiArchive.cpp'] and 'appendCitation' in files['src/activities/wiki/WikiArchive.cpp'],
           'caption fallback': 'Caption: ' in files['src/activities/wiki/WikiArchive.cpp'] and 'fileLayoutOption' in files['src/activities/wiki/WikiArchive.cpp'],
           'table readable fallback': 'normalizeTableSource' in files['src/activities/wiki/WikiArchive.cpp'] and ' — ' in files['src/activities/wiki/WikiArchive.cpp'],
           'small html marker': 'SMALL_MARKER' in files['src/activities/wiki/WikiText.h'] and 'smallOpen' in files['src/activities/wiki/WikiArchive.cpp'],
           'external link marker': 'EXT_LINK_MARKER' in files['src/activities/wiki/WikiText.h'] and 'ExternalLink' in files['src/activities/wiki/WikiText.h'],
           'external dotted underline': 'style & WikiText::ExternalLink' in files['src/activities/wiki/WikiActivity.cpp'] and 'px+=5' in files['src/activities/wiki/WikiActivity.cpp'],
           'internal 2px underline': 'style & WikiText::Link' in files['src/activities/wiki/WikiActivity.cpp'] and 'underlineY,x+runWidth-1,underlineY,2,true' in files['src/activities/wiki/WikiActivity.cpp'],
           'punctuation-aware spacing': 'inlinePunctuation' in files['src/activities/wiki/WikiActivity.cpp'] and '!punctuation(input[clusterEnd])' in files['src/activities/wiki/WikiText.cpp'],
           'list semantics': 'ListBullet' in files['src/activities/wiki/WikiText.h'] and 'ListNumber' in files['src/activities/wiki/WikiText.h'] and 'ordinal' in files['src/activities/wiki/WikiText.h'],
           'definition semantics': 'DefinitionTerm' in files['src/activities/wiki/WikiText.h'] and 'DefinitionBody' in files['src/activities/wiki/WikiText.h'],
           'level1 real-dump heading support': "text[pos] == '='" in files['src/activities/wiki/WikiText.cpp'] and 'std::min(leadCount,trailCount)' in files['src/activities/wiki/WikiText.cpp'],
           'rich heading preservation': 'measureRich' in files['src/activities/wiki/WikiHeading.h'] and 'drawRich' in files['src/activities/wiki/WikiHeading.h'] and 'WikiHeading::drawRich' in files['src/activities/wiki/WikiActivity.cpp'],
           'malformed template recovery': 'Malformed/unbounded templates must not swallow' in files['src/activities/wiki/WikiArchive.cpp'],
           'hard parser budgets': all(x in files['src/activities/wiki/WikiArchive.h'] for x in ['XML_MAX_LINKS = 64','XML_MAX_CATEGORIES = 32','XML_MAX_REFERENCES = 48','XML_MAX_REFERENCE_BYTES = 1536','XML_MAX_CAPTION_BYTES = 1024','XML_MAX_TEMPLATE_SCAN = 16384']),
           'common html entities': all(x in files['src/activities/wiki/WikiArchive.cpp'] for x in ['"nbsp"','"mdash"','"hellip"','"ldquo"','"rdquo"']),
           '4.3.2 banner preserved': 'renderer.drawText(UI_10_FONT_ID,left,textY,article.c_str(),true,EpdFontFamily::BOLD)' in files['src/activities/wiki/WikiActivity.cpp'] and 'renderer.drawText(SMALL_FONT_ID,right-libW,textY,lib.c_str())' in files['src/activities/wiki/WikiActivity.cpp'],
          }
          for k,v in checks.items(): print(('PASS' if v else 'FAIL')+': '+k)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('failed: '+', '.join(bad))
          print(f'{len(checks)} Wiki 4.3.3 source-contract checks passed.')
          PY
          python /tmp/wiki-beta433-tests.py 2>&1 | tee wiki-beta433-tests.log

      - name: Test Wiki 4.3.3 inline and document semantics
        run: |
          set -euo pipefail
          cat >/tmp/wiki-beta433-text-host.cpp <<'CPP'
          #include <cstdlib>
          #include <iostream>
          #include <string>
          #include "WikiText.h"
          static void expect(const std::string& source,const std::string& expected,const char* label){
            char out[512]; WikiText::stripInlineStyles(source.c_str(),out,sizeof(out));
            if(std::string(out)!=expected){std::cerr<<"FAIL "<<label<<": ["<<out<<"] != ["<<expected<<"]\n"; std::exit(1);}
            std::cout<<"PASS "<<label<<"\n";
          }
          int main(){
            expect("the'''MOON'''is","the MOON is","tight bold boundaries");
            expect("The '''Sun'''.","The Sun.","punctuation stays attached");
            std::string link="see"; link.push_back(char(WikiText::LINK_MARKER)); link+="Moon"; link.push_back(char(WikiText::LINK_MARKER)); link+=", now";
            expect(link,"see Moon, now","link punctuation stays attached");
            std::string small="a"; small.push_back(char(WikiText::SMALL_MARKER)); small+="small"; small.push_back(char(WikiText::SMALL_MARKER)); small+="b";
            expect(small,"a small b","small semantic boundaries");
            std::string ext="a"; ext.push_back(char(WikiText::EXT_LINK_MARKER)); ext+="external"; ext.push_back(char(WikiText::EXT_LINK_MARKER)); ext+="b";
            expect(ext,"a external b","external semantic boundaries");
            WikiText::Document doc;
            const char* text="* Bullet\n# Number\n;Term\n:Definition\n=Real dump heading=\n";
            doc.build(std::string(text),true);
            bool bullet=false,number=false,term=false,definition=false,heading=false;
            for(size_t i=0;i<doc.count();++i){
              const auto& b=doc.block(i);
              bullet |= b.kind==WikiText::Kind::ListBullet;
              number |= b.kind==WikiText::Kind::ListNumber && b.ordinal==1;
              term |= b.kind==WikiText::Kind::DefinitionTerm;
              definition |= b.kind==WikiText::Kind::DefinitionBody;
              heading |= b.kind==WikiText::Kind::Heading && b.level==1;
            }
            if(!(bullet&&number&&term&&definition&&heading)){std::cerr<<"FAIL document semantics\n"; return 1;}
            std::cout<<"PASS document semantics\n";
            return 0;
          }
          CPP
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -Isrc/activities/wiki /tmp/wiki-beta433-text-host.cpp src/activities/wiki/WikiText.cpp -o /tmp/wiki-beta433-text-host
          ASAN_OPTIONS=detect_leaks=1 /tmp/wiki-beta433-text-host 2>&1 | tee wiki-beta433-host.log

      - name: Restore ESP32 compiler cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.platformio
            .cache
          key: wiki-pio-v3-${{ runner.os }}-${{ hashFiles('platformio.ini', 'platformio.local.ini') }}
          restore-keys: wiki-pio-v3-${{ runner.os }}-

      - name: Install upstream build dependencies
        run: |
          python -m pip install https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          python -m pip install -r requirements.txt
          python -m pip install 'littlefs-python>=0.16.0' 'fatfs-ng>=0.1.14' 'pyyaml>=6.0.2' 'rich-click>=1.8.6' 'zopfli>=0.2.2' 'intelhex>=2.3.0' 'rich>=14.0.0' 'urllib3<2' 'cryptography>=45.0.3' 'certifi>=2025.8.3' 'ecdsa>=0.19.1' 'bitstring>=4.3.1' 'reedsolo>=1.5.3,<1.8' 'esp-idf-size>=2.0.0' 'esp-coredump>=1.14.0' 'esptool>=5,<6'

      - name: Refresh source-dependent SDK metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          (Path.home()/'.platformio/packages/framework-arduinoespressif32-libs/esp32c3/sdkconfig.crosspoint').unlink(missing_ok=True)
          print('Invalidated source-dependent ESP32-C3 SDK metadata for Wiki 4.3.3.')
          PY

      - name: Build original X4 application only
        id: compile
        run: |
          set -euo pipefail
          pio run -e wiki_x4_beta 2>&1 | tee wiki-build.log

      - name: Validate and package Wiki 4.3.3 candidate
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python - <<'PY' 2>&1 | tee wiki-package.log
          import json
          import wiki_package as base
          base.NAME='crosspoint-1.6.0-wiki-4.3.3-x4-UNTESTED.bin'
          base.UI_VERSION='1.6.0-wiki-4.3.3'
          base.main()
          manifest=json.loads((base.OUT/'build-manifest.json').read_text())
          manifest.update(
            features=['Wiki 4.3.2 feature set','Bounded semantic MediaWiki reading parser','Internal/external link semantics','Category and reference metadata','Named reference reuse','Image-caption text fallback','Simple table text fallback','Rich heading inline styles','Bullet/numbered/definition list semantics','Punctuation-aware formatted-run spacing','Small/div/span HTML reading support','Explicit parser budgets'],
            wiki_article_banner='Compact themed header: article title flush left; library name flush right; no colon',
            wiki_semantic_reader='Preserves bounded semantic metadata while degrading unsupported MediaWiki constructs to readable e-ink text',
            wiki_formatted_run_spacing='One visual space at tight regular-to-formatted boundaries except adjacent punctuation; existing whitespace not doubled; nested formatted transitions not padded',
            wiki_reference_corpus=['wikipedia-test-small.xml','enwikibooks-2026-09-01-p1p485446.xml.bz2 (sampled development corpus)','enwikiversity-2026-09-01-p1p331750.xml.bz2 (sampled development corpus)'],
            xml_supported=True,
            compressed_xml_bz2_supported=False,
            hardware_tested=False)
          (base.OUT/'build-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('Wiki 4.3.3 package finalized.')
          PY

      - name: Upload Wiki 4.3.3 candidate

      - name: Test Wiki 4.3.4 spacing regressions
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee wiki-beta434-tests.log
          from pathlib import Path
          A=Path('src/activities/wiki/WikiArchive.cpp').read_text(); T=Path('src/activities/wiki/WikiText.cpp').read_text()

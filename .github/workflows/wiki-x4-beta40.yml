name: X4 Wiki 4.0 XML

on:
  push:
    branches: [wiki-x4-beta]
    paths:
      - '.github/workflows/wiki-x4-beta40.yml'
      - 'wiki-beta40-overlay.b64.chunk*'
      - 'wiki-beta40-build-request.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-x4-beta40-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Reconstruct beta 3 baseline and beta 2
        run: |
          set -euo pipefail
          cat wiki-beta3-overlay.b64.part00 wiki-beta3-overlay.b64.part01 wiki-beta3-overlay.b64.part02 \
              wiki-beta3-overlay.b64.part03 wiki-beta3-overlay.b64.part04 wiki-beta3-overlay.b64.part05 \
              wiki-beta3-overlay.b64.part06 | tr -d '\r\n' | base64 -d > /tmp/b3.tar.gz
          echo '67d274746aae27b4d58c5a47e55b16f83eb43112e2cb7b0d3fd877b4a9cc3a2e  /tmp/b3.tar.gz' | sha256sum -c -
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          for n,d in json.loads(Path('wiki-beta2-reviewed-source.json').read_text()).items():
              if hashlib.sha256(Path(n).read_bytes()).hexdigest()!=d: raise SystemExit('Beta 2 input mismatch: '+n)
          PY
          python scripts/wiki_harden.py
          python scripts/wiki_integrate.py
          python scripts/wiki_beta2_integrate.py
          git diff --check

      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev

      - name: Run baseline WCDB tests
        run: |
          set -euo pipefail
          python scripts/wiki_native_verify.py 2>&1 | tee wiki-host-tests.log
          python scripts/wiki_beta2_tests.py 2>&1 | tee wiki-beta2-tests.log

      - name: Apply beta 3 overlay
        run: |
          set -euo pipefail
          rm -rf /tmp/b3 && mkdir /tmp/b3 && tar -xzf /tmp/b3.tar.gz -C /tmp/b3
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          t=Path('/tmp/b3'); r=Path('.')
          if hashlib.sha256((t/'files/wiki-beta3-reviewed-source.json').read_bytes()).hexdigest()!='7ad901019676e5a80dea4dd876e528c0e5d29d5879be97ce0750bc44de6c3801': raise SystemExit('Beta 3 manifest mismatch')
          for n,d in json.loads((t/'input-hashes.json').read_text()).items():
              if hashlib.sha256((r/n).read_bytes()).hexdigest()!=d: raise SystemExit('Beta 3 input mismatch: '+n)
          for n,d in json.loads((t/'overlay-files-sha256.json').read_text()).items():
              s=t/'files'/n
              if hashlib.sha256(s.read_bytes()).hexdigest()!=d: raise SystemExit('Beta 3 corruption: '+n)
              q=r/n; q.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(s,q)
          PY
          git diff --check
          python scripts/wiki_beta3_tests.py 2>&1 | tee wiki-beta3-tests.log
          python scripts/wiki_heading_tests.py 2>&1 | tee wiki-heading-tests.log

      - name: Apply beta 3.5 and 3.6 overlays
        run: |
          set -euo pipefail
          cat wiki-beta35-overlay.b64.part00 wiki-beta35-overlay.b64.part01a wiki-beta35-overlay.b64.part01b wiki-beta35-overlay.b64.part02 \
            | tr -d '\r\n' | base64 -d > /tmp/b35.tar.gz
          echo '7a56f4114a721ad6f03da168dfd3b2c129fc6725cb85947fc9677d6f3bc993f8  /tmp/b35.tar.gz' | sha256sum -c -
          cat wiki-beta36-overlay.b64.part00 wiki-beta36-overlay.b64.part01 wiki-beta36-overlay.b64.part02a \
              wiki-beta36-overlay.b64.part02b wiki-beta36-overlay.b64.part03a wiki-beta36-overlay.b64.part03b \
            | tr -d '\r\n' | base64 -d > /tmp/b36.tar.gz
          echo '6c7e7ed07abbffca4272f3572a30554c1b5340d6db890bcc7b3dc783b6373989  /tmp/b36.tar.gz' | sha256sum -c -
          python - <<'PY'
          import hashlib,json,shutil,tarfile
          from pathlib import Path
          root=Path('.')
          for label,arc in [('3.5','/tmp/b35.tar.gz'),('3.6','/tmp/b36.tar.gz')]:
              t=Path('/tmp/b'+label.replace('.','')); t.mkdir(exist_ok=True)
              with tarfile.open(arc) as x: x.extractall(t)
              for n,d in json.loads((t/'input-hashes.json').read_text()).items():
                  if hashlib.sha256((root/n).read_bytes()).hexdigest()!=d: raise SystemExit('Beta '+label+' input mismatch: '+n)
              for n,d in json.loads((t/'overlay-files-sha256.json').read_text()).items():
                  s=t/'files'/n
                  if hashlib.sha256(s.read_bytes()).hexdigest()!=d: raise SystemExit('Beta '+label+' corruption: '+n)
                  q=root/n; q.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(s,q)
          PY
          git diff --check
          python scripts/wiki_beta35_tests.py 2>&1 | tee wiki-beta35-tests.log
          python scripts/wiki_beta36_tests.py 2>&1 | tee wiki-beta36-tests.log

      - name: Reconstruct beta 3.9 baseline
        run: |
          set -euo pipefail
          python scripts/wiki_beta37_integrate.py
          python scripts/wiki_beta38_integrate.py
          python scripts/wiki_beta39_integrate.py
          git diff --check
          python scripts/wiki_beta39_tests.py 2>&1 | tee wiki-beta39-tests.log

      - name: Apply and test Wiki 4.0 XML overlay
        run: |
          set -euo pipefail
          cat wiki-beta40-overlay.b64.chunk00 wiki-beta40-overlay.b64.chunk01 wiki-beta40-overlay.b64.chunk02 \
              wiki-beta40-overlay.b64.chunk03 wiki-beta40-overlay.b64.chunk04 wiki-beta40-overlay.b64.chunk05 \
              wiki-beta40-overlay.b64.chunk06 wiki-beta40-overlay.b64.chunk07 wiki-beta40-overlay.b64.chunk08 \
            | tr -d '\r\n' | base64 -d > /tmp/b40.tar.gz
          echo '79107fa050bda58f4a51b0e74b4f442deb1cc61ba815f56a7fdbe0ca5ce5b4eb  /tmp/b40.tar.gz' | sha256sum -c -
          rm -rf /tmp/b40 && mkdir /tmp/b40 && tar -xzf /tmp/b40.tar.gz -C /tmp/b40
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          t=Path('/tmp/b40'); r=Path('.')
          for n,d in json.loads((t/'input-hashes.json').read_text()).items():
              a=hashlib.sha256((r/n).read_bytes()).hexdigest()
              if a!=d: raise SystemExit('4.0 input mismatch: '+n+' '+a)
          fs=json.loads((t/'overlay-files-sha256.json').read_text())
          for n,d in fs.items():
              s=t/'files'/n
              if hashlib.sha256(s.read_bytes()).hexdigest()!=d: raise SystemExit('4.0 overlay corruption: '+n)
              q=r/n; q.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(s,q)
          for n,d in json.loads(Path('wiki-beta40-reviewed-source.json').read_text()).items():
              a=hashlib.sha256(Path(n).read_bytes()).hexdigest()
              if a!=d: raise SystemExit('4.0 source mismatch: '+n+' '+a)
          print('Verified',len(fs),'Wiki 4.0 overlay files')
          PY
          git diff --check
          python scripts/wiki_beta40_xml_tests.py 2>&1 | tee wiki-beta40-tests.log
          python - <<'PY'
          from pathlib import Path
          a=Path('src/activities/wiki/WikiArchive.cpp').read_text(); h=Path('src/activities/wiki/WikiArchive.h').read_text(); u=Path('src/activities/wiki/WikiActivity.cpp').read_text(); p=Path('platformio.local.ini').read_text()
          assert 'MediaWikiXml' in a and 'MediaWikiXml' in h and 'WXMLIDX1' in a
          assert '.xml' in u and '[XML]' in u and '1.6.0-wiki-4.0' in p
          print('Wiki 4.0 XML source invariants verified')
          PY

      - name: Upload Wiki 4.0 integrated source for inspection
        uses: actions/upload-artifact@v6
        with:
          name: wiki-beta40-source-debug
          path: |
            src/activities/wiki/
            scripts/wiki_beta40_xml_tests.py
            platformio.local.ini
            WIKI_BETA40.md
            wiki-beta40-reviewed-source.json
            LICENSE
          if-no-files-found: error

      - name: Restore ESP32 compiler cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.platformio
            .cache
          key: wiki-pio-v3-${{ runner.os }}-${{ hashFiles('platformio.ini', 'platformio.local.ini') }}
          restore-keys: wiki-pio-v3-${{ runner.os }}-

      - name: Install upstream build dependencies
        run: |
          python -m pip install https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          python -m pip install -r requirements.txt
          python -m pip install 'littlefs-python>=0.16.0' 'fatfs-ng>=0.1.14' 'pyyaml>=6.0.2' 'rich-click>=1.8.6' 'zopfli>=0.2.2' 'intelhex>=2.3.0' 'rich>=14.0.0' 'urllib3<2' 'cryptography>=45.0.3' 'certifi>=2025.8.3' 'ecdsa>=0.19.1' 'bitstring>=4.3.1' 'reedsolo>=1.5.3,<1.8' 'esp-idf-size>=2.0.0' 'esp-coredump>=1.14.0' 'esptool>=5,<6'

      - name: Refresh source-dependent SDK metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          (Path.home()/'.platformio/packages/framework-arduinoespressif32-libs/esp32c3/sdkconfig.crosspoint').unlink(missing_ok=True)
          PY

      - name: Build original X4 application only
        id: compile
        run: |
          set -euo pipefail
          pio run -e wiki_x4_beta 2>&1 | tee wiki-build.log

      - name: Retain raw build for independent inspection
        if: ${{ steps.compile.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: wiki-beta40-raw-build-inspection-NOT-VALIDATED
          path: |
            .pio/build/wiki_x4_beta/firmware.bin
            .pio/build/wiki_x4_beta/partitions.bin
          include-hidden-files: true
          if-no-files-found: error

      - name: Validate and package Wiki 4.0 candidate
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python - <<'PY' 2>&1 | tee wiki-package.log
          import hashlib,json,shutil,tarfile
          from pathlib import Path
          import wiki_package as base
          base.NAME='crosspoint-1.6.0-wiki-4.0-x4-UNTESTED.bin'; base.UI_VERSION='1.6.0-wiki-4.0'; base.main()
          root,out=base.ROOT,base.OUT; m=json.loads((out/'build-manifest.json').read_text()); hs=m['compiled_and_supporting_source_sha256']
          for n in ['scripts/wiki_beta40_xml_tests.py','WIKI_BETA40.md','wiki-beta40-reviewed-source.json']:
              hs[n]=hashlib.sha256((root/n).read_bytes()).hexdigest()
          m.update(features=['Beta 3.9 feature set','Native uncompressed MediaWiki XML library backend','Persistent XML title sidecar index','Bounded wikitext simplifier'],wiki_library_formats=['WCDB .cdb','MediaWiki XML .xml'],xml_supported=True,xml_compressed_supported=False,xml_article_buffer_max_bytes=49152,zim_supported=False,images_supported_in_xml=False,hardware_tested=False)
          (out/'build-manifest.json').write_text(json.dumps(m,indent=2)+'\n'); shutil.copy2(root/'WIKI_BETA40.md',out/'WIKI_BETA40.md')
          with tarfile.open(out/'wiki-changed-source.tar.gz','w:gz') as t:
              for n in sorted(hs):
                  p=root/n
                  if p.is_file(): t.add(p,arcname=n)
          (out/'SHA256SUMS.txt').write_text('\n'.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name for p in sorted(out.iterdir()) if p.is_file() and p.name!='SHA256SUMS.txt')+'\n')
          PY

      - name: Upload Wiki 4.0 candidate
        uses: actions/upload-artifact@v6
        with:
          name: crosspoint-1.6.0-wiki-4.0-x4-UNTESTED
          path: wiki-dist/
          if-no-files-found: error

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wiki-beta40-build-log
          path: |
            wiki-build.log
            wiki-host-tests.log
            wiki-beta2-tests.log
            wiki-beta3-tests.log
            wiki-heading-tests.log
            wiki-beta35-tests.log
            wiki-beta36-tests.log
            wiki-beta39-tests.log
            wiki-beta40-tests.log
            wiki-real-pack-report.json
            wiki-package.log
          if-no-files-found: ignore

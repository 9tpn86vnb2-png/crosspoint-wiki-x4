name: X4 Wiki beta

on:
  push:
    branches: [wiki-x4-beta]
    paths:
      - '.github/workflows/wiki-x4-beta.yml'
      - 'wiki-build-request.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-x4-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Require integrated Wiki source
        run: |
          test -f src/activities/wiki/WikiActivity.cpp
          test -f platformio.local.ini
          test -f scripts/wiki_package.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install upstream build dependencies
        run: |
          python -m pip install https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          python -m pip install -r requirements.txt
          python -m pip install 'littlefs-python>=0.16.0' 'fatfs-ng>=0.1.14' 'pyyaml>=6.0.2' 'rich-click>=1.8.6' 'zopfli>=0.2.2' 'intelhex>=2.3.0' 'rich>=14.0.0' 'urllib3<2' 'cryptography>=45.0.3' 'certifi>=2025.8.3' 'ecdsa>=0.19.1' 'bitstring>=4.3.1' 'reedsolo>=1.5.3,<1.8' 'esp-idf-size>=2.0.0' 'esp-coredump>=1.14.0'
      - name: Build original X4 application only
        run: |
          set -euo pipefail
          pio run -e wiki_x4_beta 2>&1 | tee wiki-build.log
      - name: Validate and package candidate
        run: python scripts/wiki_package.py
      - name: Upload beta candidate
        uses: actions/upload-artifact@v6
        with:
          name: crosspoint-1.6.0-wiki-beta1-x4-UNTESTED
          path: wiki-dist/
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wiki-build-log
          path: wiki-build.log
          if-no-files-found: ignore

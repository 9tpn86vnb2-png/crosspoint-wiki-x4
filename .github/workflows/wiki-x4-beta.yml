name: X4 Wiki beta

on:
  push:
    branches: [wiki-x4-beta]
    paths:
      - '.github/workflows/wiki-x4-beta.yml'
      - 'wiki-build-request.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-x4-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify beta 2 reviewed source
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected=json.loads(Path('wiki-beta2-reviewed-source.json').read_text())
          for name,digest in expected.items():
            actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
            if actual!=digest: raise SystemExit('Source transfer mismatch: '+name+' '+actual)
          print('All',len(expected),'reviewed beta 2 source files match.')
          PY
      - name: Integrate beta 3 source
        run: |
          set -euo pipefail
          python scripts/wiki_harden.py
          python scripts/wiki_integrate.py
          python scripts/wiki_beta2_integrate.py
          python scripts/wiki_beta3_patch.py
          git diff --check
      - name: Upload integrated source for inspection
        uses: actions/upload-artifact@v6
        with:
          name: wiki-beta3-source-debug
          path: |
            src/activities/wiki/
            src/activities/home/HomeActivity.h
            src/activities/home/HomeActivity.cpp
            src/activities/ActivityManager.h
            src/activities/settings/TextSettingsActivity.h
            src/activities/settings/TextSettingsActivity.cpp
            src/activities/settings/TextSettingsPreview.h
            src/activities/settings/TextSettingsPreview.cpp
            src/components/icons/wikiGlobe.h
            src/components/icons/wikiLogo.h
            src/components/themes/BaseTheme.h
            src/components/themes/BaseTheme.cpp
            src/components/themes/lyra/LyraTheme.cpp
            src/components/themes/roundedraff/RoundedRaffTheme.cpp
            lib/InflateReader/
            lib/uzlib/
            scripts/wiki_beta3_patch.py
            platformio.local.ini
          if-no-files-found: error
      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
      - name: Test hardened decoder and published Wikipedia pack
        run: |
          set -euo pipefail
          python scripts/wiki_native_verify.py 2>&1 | tee wiki-host-tests.log
      - name: Restore ESP32 compiler cache
        id: pio-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.platformio
            .cache
          key: wiki-pio-v4-${{ runner.os }}-${{ hashFiles('platformio.ini', 'platformio.local.ini') }}
          restore-keys: wiki-pio-v4-${{ runner.os }}-
      - name: Install upstream build dependencies
        run: |
          python -m pip install https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          python -m pip install -r requirements.txt
          python -m pip install 'littlefs-python>=0.16.0' 'fatfs-ng>=0.1.14' 'pyyaml>=6.0.2' 'rich-click>=1.8.6' 'zopfli>=0.2.2' 'intelhex>=2.3.0' 'rich>=14.0.0' 'urllib3<2' 'cryptography>=45.0.3' 'certifi>=2025.8.3' 'ecdsa>=0.19.1' 'bitstring>=4.3.1' 'reedsolo>=1.5.3,<1.8' 'esp-idf-size>=2.0.0' 'esp-coredump>=1.14.0' 'esptool>=5,<6'
      - name: Refresh source-dependent SDK metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          marker = Path.home() / '.platformio/packages/framework-arduinoespressif32-libs/esp32c3/sdkconfig.crosspoint'
          marker.unlink(missing_ok=True)
          print('Invalidated source-dependent ESP32-C3 SDK metadata for beta 3.')
          PY
      - name: Build original X4 application only
        id: compile
        run: |
          set -euo pipefail
          pio run -e wiki_x4_beta 2>&1 | tee wiki-build.log
      - name: Retain raw build for independent inspection
        if: ${{ steps.compile.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: wiki-beta3-raw-build-NOT-VALIDATED
          path: |
            .pio/build/wiki_x4_beta/firmware.bin
            .pio/build/wiki_x4_beta/partitions.bin
          include-hidden-files: true
          if-no-files-found: error
      - name: Validate and package beta 3 candidate
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee wiki-package.log
          import wiki_package
          wiki_package.NAME='crosspoint-1.6.0-wiki-beta3-x4-UNTESTED.bin'
          wiki_package.UI_VERSION='1.6.0-wiki-beta3'
          wiki_package.main()
          PY
      - name: Upload beta 3 candidate
        uses: actions/upload-artifact@v6
        with:
          name: crosspoint-1.6.0-wiki-beta3-x4-UNTESTED
          path: wiki-dist/
          if-no-files-found: error
      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wiki-beta3-build-log
          path: |
            wiki-build.log
            wiki-host-tests.log
            wiki-real-pack-report.json
            wiki-package.log
          if-no-files-found: ignore
      - name: Preserve compiler cache after a build attempt
        if: ${{ always() && steps.pio-cache.outputs.cache-hit != 'true' && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.platformio
            .cache
          key: wiki-pio-v4-${{ runner.os }}-${{ hashFiles('platformio.ini', 'platformio.local.ini') }}

name: X4 Wiki 4.6.4.1 file-handle crash hotfix
on:
  push:
    branches: [wiki-x4-4.6.4.1-hotfix]
    paths: ['.github/wiki4641_*', '.github/workflows/wiki4641.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: wiki4641-c3-toolchain-${{ github.run_id }}
          restore-keys: |
            wiki4641-c3-toolchain-
            wiki464-c3-toolchain-v1-
      - name: Restore exact successful 4.6.4 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wiki464-base"
          if gh run download 34958057070 -R "$GITHUB_REPOSITORY" -n CrossPoint-Wiki-4.6.4-X4-experimental -D "$RUNNER_TEMP/wiki464-base"; then
            echo "7de737abc3dcfa0a7b3e177da120a25ad73fcbbf594726bfc8a79b4b999e62e2  $RUNNER_TEMP/wiki464-base/4.6.4-source-without-font-assets.tar.gz" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/wiki464-base/4.6.4-source-without-font-assets.tar.gz"
          else
            python -m pip install pyyaml
            python - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          w=yaml.safe_load(Path('.github/workflows/wiki464.yml').read_text())
          for step in w['jobs']['build']['steps']:
              if step.get('name') == 'Test cooperative indexing, resume, storage failures and final-source contracts': break
              if 'run' in step: subprocess.run(['bash','-euo','pipefail','-c',step['run']],check=True)
          PY
          fi
      - name: Reproduce reported assertion with real unpatched HAL
        run: |
          set -euo pipefail
          ulimit -c 0
          python -u .github/wiki4641_test.py --expect-bug 2>&1 | tee wiki4641-before.log
      - name: Apply narrow guarded-cleanup hotfix
        run: |
          set -euo pipefail
          python .github/wiki4641_apply.py
          python .github/wiki4641_release.py prepare
          python -u .github/wiki4641_test.py 2>&1 | tee wiki4641-preflight.log
      - name: Compile original X4 application with PlatformIO CLI
        id: compile
        run: bash .github/wiki441_toolchain.sh
      - name: Recheck final source and package application
        run: |
          set -euo pipefail
          python -u .github/wiki4641_test.py 2>&1 | tee wiki4641-postbuild.log
          python -u .github/wiki4641_release.py test 2>&1 | tee wiki4641-archive.log
          python -u .github/wiki463_host/run.py --json .pio/libdeps/wiki_x4_beta/ArduinoJson/src 2>&1 | tee wiki4641-retained.log
          python .github/wiki4641_release.py package
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: CrossPoint-Wiki-4.6.4.1-X4-hotfix
          path: wiki4641-dist/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wiki4641-diagnostics
          path: |
            wiki-build.log
            wiki4641-*.log
            wiki4641-*.json
            wiki464-*.json
          retention-days: 14
      - uses: actions/cache/save@v4
        if: always() && steps.compile.outcome != 'skipped'
        with:
          path: |
            ~/.platformio
            .pio
          key: wiki4641-c3-toolchain-${{ github.run_id }}

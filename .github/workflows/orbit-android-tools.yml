name: Orbit host-test dependency
on:
  push:
    branches: [orbit-android-tools-20261116]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch pinned JVM-only JSON test library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-dependency
          cd test-dependency
          curl --fail --silent --show-error --location --proto '=https' -o json-20240303.jar https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          curl --fail --silent --show-error --location --proto '=https' -o json-20240303.jar.sha1 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar.sha1
          printf '%s  json-20240303.jar\n' "$(cat json-20240303.jar.sha1)" | sha1sum -c -
          sha256sum json-20240303.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-host-json-test-dependency
          path: test-dependency/
          retention-days: 3

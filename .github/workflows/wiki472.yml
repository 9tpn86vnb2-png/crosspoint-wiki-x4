name: X4 Wiki 4.7.2 browse controls and indexing focus
on:
  push:
    branches: [wiki-x4-4.7.2-experimental]
    paths: ['.github/workflows/wiki472.yml', '.github/wiki472.payload.*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WIKI472_BASE: /tmp/wiki472-base
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: wiki472-c3-${{ github.run_id }}
          restore-keys: |
            wiki472-c3-
            wiki471-c3-
            wiki470-c3-
      - name: Restore exact successful 4.7.1 and retain test baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 35126440213 -R "$GITHUB_REPOSITORY" -n CrossPoint-Wiki-4.7.1-X4-experimental -D "$RUNNER_TEMP/base471"
          echo "ef191310c3651341ffb8b9765289b5c4383df7573f8a1d5111b4a483037501a8  $RUNNER_TEMP/base471/4.7.1-source-without-font-assets.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/base471/4.7.1-source-without-font-assets.tar.gz"
          mkdir -p "$WIKI472_BASE"
          cp -a src lib scripts .github platformio.ini platformio.local.ini "$WIKI472_BASE/"
      - name: Apply fingerprint-checked source and generate strings
        run: |
          set -euo pipefail
          python - <<'PYLOAD'
          from pathlib import Path
          import base64,hashlib,json,lzma,difflib
          chunks=sorted(Path('.github').glob('wiki472.payload.*'));assert chunks
          blob=base64.b64decode(''.join(p.read_text().strip() for p in chunks),validate=True)
          assert hashlib.sha256(blob).hexdigest()=='3bfe6ed6b472f43d4a341073c2830bc22e7876b5df5ee50e2c3bfcfba246bd4c'
          data=json.loads(lzma.decompress(blob));updated={};patch=[]
          for name,item in data.items():
              p=Path(name);assert not p.is_absolute() and '..' not in p.parts
              prior=p.read_bytes() if p.exists() else b''
              assert (hashlib.sha256(prior).hexdigest()==item['base']) if item['base'] else not p.exists(),name
              lines=prior.decode().splitlines(True);end=len(lines)
              for start,stop,replacement in reversed(item['edits']):
                  assert 0<=start<=stop<=end
                  lines[start:stop]=replacement.splitlines(True);end=start
              final=''.join(lines).encode();assert hashlib.sha256(final).hexdigest()==item['after'],name
              updated[p]=final
              if name.startswith(('src/','lib/')) or name=='platformio.local.ini':patch.extend(difflib.unified_diff(prior.decode().splitlines(True),final.decode().splitlines(True),fromfile='a/'+name,tofile='b/'+name))
          for p,final in updated.items():p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(final)
          Path('4.7.1-to-4.7.2.patch').write_text(''.join(patch))
          print('Verified and applied',len(updated),'source/support changes')
          PYLOAD
          python scripts/gen_i18n.py --strip-unused
          python .github/wiki472_release.py prepare
      - name: Test controls, exclusions, old checkpoints and retained behaviour
        run: |
          set -euo pipefail
          ulimit -c 0
          python -u .github/wiki472_release.py upgrade 2>&1 | tee wiki472-upgrade.log
          python -u .github/wiki472_release.py test 2>&1 | tee wiki472-preflight.log
      - name: Compile original X4 application with PlatformIO CLI
        id: compile
        run: bash .github/wiki441_toolchain.sh
      - name: Verify final source, flags and actual firmware image
        run: |
          set -euo pipefail
          pio run -e wiki_x4_beta -t compiledb > wiki472-compiledb.log 2>&1
          python .github/wiki472_release.py flags
          python -u .github/wiki472_release.py test 2>&1 | tee wiki472-postbuild.log
          python -u .github/wiki463_host/run.py --json .pio/libdeps/wiki_x4_beta/ArduinoJson/src 2>&1 | tee wiki472-algorithms.log
          python .github/wiki472_release.py package
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: CrossPoint-Wiki-4.7.2-X4-experimental
          path: wiki472-dist/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wiki472-diagnostics
          path: |
            wiki-build.log
            wiki472-*.log
            wiki472-*.json
            wiki471-*.json
            wiki470-tests.json
            wiki465-tests.json
          retention-days: 14
      - uses: actions/cache/save@v4
        if: always() && steps.compile.outcome != 'skipped'
        with:
          path: |
            ~/.platformio
            .pio
          key: wiki472-c3-${{ github.run_id }}

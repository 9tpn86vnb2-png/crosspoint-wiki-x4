name: X4 Wiki 4.6.3 experimental build
on:
  push:
    branches: [wiki-x4-4.6.3-experimental]
    paths: ['.github/workflows/wiki463.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: wiki463-c3-toolchain-v1-${{ github.run_id }}
          restore-keys: wiki463-c3-toolchain-v1-
      - name: Reconstruct exact integrated 4.6.2 baseline
        run: |
          set -euo pipefail
          bash .github/wiki441_build.sh.00
          bash .github/wiki441_build.sh.01a1
          bash .github/wiki441_verify.sh
          python .github/wiki442_epub_patch.py
          python .github/wiki442_contract_tests.py
          python .github/wiki450_apply.py
          python .github/wiki450_contract_tests.py
          python .github/wiki451_apply.py
          python .github/wiki451_contract_tests.py
          python .github/wiki452_apply.py
          python .github/wiki452_contract_tests.py
          python .github/wiki453_apply.py
          python .github/wiki453_contract_tests.py
          python .github/wiki454_apply.py
          python .github/wiki454_contract_tests.py
          python .github/wiki460_apply.py
          python .github/wiki460_contract_tests.py
          python .github/wiki461_apply.py
          python .github/wiki461_contract_tests.py
          python .github/wiki462_apply.py
          python .github/wiki462_contract_tests.py
          mkdir -p wiki463-baseline
          cp lib/Epub/Epub/blocks/TextBlock.cpp lib/Epub/Epub/blocks/TextBlock.h wiki463-baseline/
      - name: Apply the complete experimental change set
        run: |
          set -euo pipefail
          python .github/wiki463_storage.py
          python .github/wiki463_reader.py
          python .github/wiki463_search.py
          python .github/wiki463_render.py
          python .github/wiki463_review.py
          python .github/wiki463_compile_fixes.py
          python .github/wiki463_finish.py prepare
      - name: Preflight production algorithms with sanitizers
        run: |
          set -euo pipefail
          if [ ! -f .pio/libdeps/wiki_x4_beta/ArduinoJson/src/ArduinoJson.h ]; then
            mkdir -p .pio/libdeps/wiki_x4_beta
            git clone --depth 1 --branch v7.4.2 https://github.com/bblanchon/ArduinoJson.git .pio/libdeps/wiki_x4_beta/ArduinoJson
          fi
          python .github/wiki463_finish.py test 2>&1 | tee wiki463-preflight.log
      - name: Compile original X4 application
        id: compile
        run: bash .github/wiki441_toolchain.sh
      - name: Recheck compiled source and package real application
        run: |
          set -euo pipefail
          python .github/wiki463_finish.py test 2>&1 | tee wiki463-postbuild.log
          python .github/wiki463_finish.py package
      - name: Retain debugging source without font or book assets
        if: always()
        run: |
          mkdir -p wiki463-debug
          cp wiki-build.log wiki463-*.log wiki463-*.json wiki463-debug/ 2>/dev/null || true
          tar --exclude='*/builtinFonts' --exclude='*/assets/Fonts' --exclude='*/assets/Icons' --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff*' --exclude='*/.git' --exclude='*/lucide' -czf wiki463-debug/source.tar.gz src lib scripts .github freeink-sdk platformio.ini platformio.local.ini requirements.txt wiki463-baseline
          if [ -d .pio/libdeps/wiki_x4_beta/ArduinoJson/src ]; then
            tar -czf wiki463-debug/arduinojson-src.tar.gz -C .pio/libdeps/wiki_x4_beta/ArduinoJson src library.json
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wiki463-build-debug
          path: wiki463-debug/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: CrossPoint-Wiki-4.6.3-X4-experimental
          path: wiki463-dist/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/cache/save@v4
        if: always() && steps.compile.outcome != 'skipped'
        with:
          path: |
            ~/.platformio
            .pio
          key: wiki463-c3-toolchain-v1-${{ github.run_id }}
